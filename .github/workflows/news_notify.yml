name: Nyhetsnotiser

on:
  schedule:
    # Varannan timme, dygnet runt (UTC). Gratis GitHub Actions-cron.
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Skapa secrets.toml
        run: |
          mkdir -p .streamlit
          cat > .streamlit/secrets.toml << EOF
          GITHUB_TOKEN = "${{ secrets.DATA_REPO_TOKEN }}"
          GITHUB_DATA_REPO = "${{ secrets.DATA_REPO }}"
          TELEGRAM_BOT_TOKEN = "${{ secrets.TELEGRAM_BOT_TOKEN }}"
          TELEGRAM_CHAT_ID = "${{ secrets.TELEGRAM_CHAT_ID }}"
          GIST_TOKEN = "${{ secrets.GIST_TOKEN }}"
          EOF

      - run: python scripts/news_notify.py

      - name: Uppdatera mobil-sammanfattning (PWA)
        run: python scripts/generate_mobile_summary.py
