<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Min portfölj</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0b1220" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1220;
      --card: #131c2e;
      --text: #f2f5f9;
      --muted: #8b96a8;
      --up: #34c77b;
      --down: #ef5a5a;
      --accent: #4f8cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px);
      min-height: 100vh;
    }
    header { padding-top: 20px; padding-bottom: 8px; }
    h1 { font-size: 1.1rem; font-weight: 600; color: var(--muted); margin: 0 0 4px; }
    .varde { font-size: 2.4rem; font-weight: 700; margin: 4px 0; }
    .forandring { font-size: 1.1rem; font-weight: 600; }
    .forandring.up { color: var(--up); }
    .forandring.down { color: var(--down); }
    .uppdaterad { color: var(--muted); font-size: 0.8rem; margin-top: 4px; }
    .score-badge {
      display: inline-block; margin-top: 10px; padding: 4px 10px;
      background: var(--card); border-radius: 20px; font-size: 0.85rem; color: var(--muted);
    }
    section { margin-top: 22px; }
    section h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-bottom: 8px; }
    .card { background: var(--card); border-radius: 14px; overflow: hidden; }
    .row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 0.95rem;
    }
    .row:last-child { border-bottom: none; }
    .row .namn { font-weight: 500; }
    .row .varde-cell { text-align: right; }
    .row .varde-cell .kr { color: var(--muted); font-size: 0.8rem; display: block; }
    .news-item { padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .news-item:last-child { border-bottom: none; }
    .news-item a { color: var(--text); text-decoration: none; font-size: 0.92rem; line-height: 1.35; display: block; }
    .news-item .meta { color: var(--muted); font-size: 0.78rem; margin-top: 4px; }
    .news-item .bolag-tag { color: var(--accent); font-weight: 600; }
    .laddar, .fel { text-align: center; color: var(--muted); padding: 60px 16px; }
    .fel { color: var(--down); }
  </style>
</head>
<body>
  <div id="app">
    <div class="laddar">Laddar…</div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js");
      });
    }
  </script>
</body>
</html>
